server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: agroclima-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agroclima}
    username: ${DATABASE_USER:agroclima}
    password: "${DATABASE_PASSWORD:}"
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:12}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: "${JWT_SECRET:}"
    token-ttl-minutes: ${JWT_TTL_MINUTES:60}
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:admin@agroclima.com}
    initial-admin-password: "${INITIAL_ADMIN_PASSWORD:}"
    internal-api-key: "${INTERNAL_API_KEY:}"
    max-login-failures: ${MAX_LOGIN_FAILURES:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:5500,http://localhost:8081,http://127.0.0.1,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5500,http://127.0.0.1:8081}"

logging:
  level:
    br.com.agroclima: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
